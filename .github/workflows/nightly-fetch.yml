name: Nightly fetch

# Hybrid: cloud IP often cannot reach kamuilan.sbb.gov.tr.
# Preferred path = local Mac LaunchAgent (scripts/install-local-launchd.sh):
#   separate KK + SBB fetches, separate Telegram messages, TR IP.
#
# This workflow is manual-only (no schedule) to avoid duplicate Telegram noise.
# Telegram secrets still work if you Run workflow for cloud KK-only smoke tests.

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch Kariyer Kapısı (cloud smoke — no SBB)
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m atama_mvp.cli fetch --source kk --notify-telegram

      - name: Upload SQLite artifact
        uses: actions/upload-artifact@v7
        with:
          name: mvp-sqlite
          path: data/mvp.sqlite3
          if-no-files-found: warn
          retention-days: 14
