name: Nightly fetch

# Hybrid notes:
# - SBB often times out from GitHub cloud IPs → prefer Windows home PC for SBB.
# - ilan.gov.tr: test via workflow_dispatch source=ilan (no Telegram by default).
# Schedule disabled to avoid duplicate Telegram noise vs local Windows task.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Fetch source"
        required: true
        default: "ilan"
        type: choice
        options:
          - ilan
          - kk
          - sbb
          - all
      notify_telegram:
        description: "Send Telegram report"
        required: true
        default: false
        type: boolean

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch source (EU/cloud IP probe)
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOURCE: ${{ inputs.source }}
          NOTIFY: ${{ inputs.notify_telegram }}
        run: |
          if [ "$NOTIFY" = "true" ]; then
            python -m atama_mvp.cli fetch --source "$SOURCE" --notify-telegram
          else
            python -m atama_mvp.cli fetch --source "$SOURCE"
          fi

      - name: Upload SQLite artifact
        uses: actions/upload-artifact@v7
        with:
          name: mvp-sqlite
          path: data/mvp.sqlite3
          if-no-files-found: warn
          retention-days: 14
